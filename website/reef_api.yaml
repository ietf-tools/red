          schema:
            type: integer
          required: true
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
          description: ''
    put:
      operationId: surveys_update
      description: Retrieve, update, or delete a survey. Staff only; used by the builder.
      parameters:
