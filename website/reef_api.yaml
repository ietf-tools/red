openapi: 3.0.3
info:
  title: Reef
  version: 0.1.0
  description: Backend API for the Reef survey and engagement service
paths:
  /api/reef/popularity/:
    get:
      operationId: popularity_list
      description: The curated most-popular list. Public; consumed by Red at build
        time.
      tags:
        - popularity
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularEntry'
          description: ''
  /api/reef/ratings/{rfc}/:
    get:
      operationId: ratings_retrieve
      description: |-
        Return the public average and count of ratings for one RFC. Open to anonymous callers. A credential adds nothing but `your_rating`, the caller's own 1-5 rating of this RFC, which is null if they have not rated it; for an anonymous caller it is always null.

        The identifier is canonicalized, so `9110`, `rfc9110` and `RFC 9110` all address the same document.
      summary: Read an RFC's rating
      parameters:
        - in: path
          name: rfc
          schema:
            type: string
          required: true
      tags:
        - ratings
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingAggregate'
          description: ''
    put:
      operationId: ratings_update
      description: Record the authenticated caller's 1-5 rating of one RFC, replacing
        their previous rating of it if there is one. Requires a credential. Returns
        the same body as GET, so the response carries the recomputed average and count
        along with `your_rating` echoing the value just set.
      summary: Set the caller's rating of an RFC
      parameters:
        - in: path
          name: rfc
          schema:
            type: string
          required: true
      tags:
        - ratings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RatingWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RatingWrite'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingAggregate'
          description: ''
  /api/reef/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum:
              - json
              - yaml
        - in: query
          name: lang
          schema:
            type: string
            enum:
              - af
              - ar
              - ar-dz
              - ast
              - az
              - be
              - bg
              - bn
              - br
              - bs
              - ca
              - ckb
              - cs
              - cy
              - da
              - de
              - dsb
              - el
              - en
              - en-au
              - en-gb
              - eo
              - es
              - es-ar
              - es-co
              - es-mx
              - es-ni
              - es-ve
              - et
              - eu
              - fa
              - fi
              - fr
              - fy
              - ga
              - gd
              - gl
              - he
              - hi
              - hr
              - hsb
              - hu
              - hy
              - ia
              - id
              - ig
              - io
              - is
              - it
              - ja
              - ka
              - kab
              - kk
              - km
              - kn
              - ko
              - ky
              - lb
              - lt
              - lv
              - mk
              - ml
              - mn
              - mr
              - ms
              - my
              - nb
              - ne
              - nl
              - nn
              - os
              - pa
              - pl
              - pt
              - pt-br
              - ro
              - ru
              - sk
              - sl
              - sq
              - sr
              - sr-latn
              - sv
              - sw
              - ta
              - te
              - tg
              - th
              - tk
              - tr
              - tt
              - udm
              - ug
              - uk
              - ur
              - uz
              - vi
              - zh-hans
              - zh-hant
      tags:
        - schema
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/reef/sets/:
    get:
      operationId: sets_list
      description: List and create the caller's document sets.
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentSet'
          description: ''
    post:
      operationId: sets_create
      description: List and create the caller's document sets.
      tags:
        - sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentSet'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
  /api/reef/sets/{id}/:
    get:
      operationId: sets_retrieve
      description: Read, retitle, redescribe, publish, or delete one of the caller's
        sets.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
    put:
      operationId: sets_update
      description: Read, retitle, redescribe, publish, or delete one of the caller's
        sets.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentSet'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
    patch:
      operationId: sets_partial_update
      description: Read, retitle, redescribe, publish, or delete one of the caller's
        sets.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDocumentSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDocumentSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDocumentSet'
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
    delete:
      operationId: sets_destroy
      description: Read, retitle, redescribe, publish, or delete one of the caller's
        sets.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/reef/sets/{id}/{slug}/:
    get:
      operationId: sets_public_retrieve
      description: |-
        Read a published set, anonymously.

        A private set is a 404 rather than a 403: the endpoint does not confirm
        that one exists. A stale or wrong slug redirects to the current URL, since
        the id carries identity and the slug only has to be readable.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - in: path
          name: slug
          schema:
            type: string
          required: true
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
  /api/reef/sets/{id}/documents/{doc}/:
    put:
      operationId: sets_documents_update
      description: |-
        Add or remove one document.

        PUT is idempotent, and the identifier is canonicalized first, so
        .../documents/RFC%209110/ and .../documents/rfc9110/ are the same entry.
      parameters:
        - in: path
          name: doc
          schema:
            type: string
          required: true
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
    delete:
      operationId: sets_documents_destroy
      description: |-
        Add or remove one document.

        PUT is idempotent, and the identifier is canonicalized first, so
        .../documents/RFC%209110/ and .../documents/rfc9110/ are the same entry.
      parameters:
        - in: path
          name: doc
          schema:
            type: string
          required: true
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/reef/sets/{id}/order/:
    put:
      operationId: sets_order_update
      description: |-
        Rewrite the display order in one request.

        Ranks are replaced as a block rather than patched per entry, so a
        drag-and-drop is one call that cannot half-apply.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSetOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentSetOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentSetOrder'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
  /api/reef/stats/:
    get:
      operationId: stats_list
      description: |-
        Rating, subscriber and set numbers per document.

        Public and unpaginated: Red precomputes the whole series in one call at
        build time, which is too many identifiers to name in a query string.
        Filtering with doc is for one-off lookups.
      parameters:
        - in: query
          name: doc
          schema:
            type: array
            items:
              type: string
          description: Document identifier, repeatable. Omit to get every document that
            has any engagement at all. A named document is always returned, with zeros
            if it has none.
        - in: query
          name: set
          schema:
            type: integer
          description: Document set id. Returns a row per document the set holds, including
            members with no engagement. Public sets resolve for anyone; a private set
            resolves only for its owner, and 404s otherwise. Combines with doc as an
            intersection.
      tags:
        - stats
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentStats'
          description: ''
  /api/reef/subscriptions/:
    get:
      operationId: subscriptions_list
      description: List and create the current user's subscriptions.
      tags:
        - subscriptions
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
          description: ''
    post:
      operationId: subscriptions_create
      description: List and create the current user's subscriptions.
      tags:
        - subscriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Subscription'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Subscription'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/reef/subscriptions/{id}/:
    delete:
      operationId: subscriptions_destroy
      description: Delete one of the current user's subscriptions.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - subscriptions
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/reef/surveys/:
    get:
      operationId: surveys_list
      description: List and create surveys. Staff only; used by the builder.
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Survey'
          description: ''
    post:
      operationId: surveys_create
      description: List and create surveys. Staff only; used by the builder.
      tags:
        - surveys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Survey'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Survey'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Survey'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
          description: ''
  /api/reef/surveys/{id}/:
    get:
      operationId: surveys_retrieve
      description: Retrieve, update, or delete a survey. Staff only; used by the builder.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
          description: ''
    put:
      operationId: surveys_update
      description: Retrieve, update, or delete a survey. Staff only; used by the builder.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - surveys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Survey'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Survey'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Survey'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
          description: ''
    patch:
      operationId: surveys_partial_update
      description: Retrieve, update, or delete a survey. Staff only; used by the builder.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - surveys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSurvey'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSurvey'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSurvey'
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
          description: ''
    delete:
      operationId: surveys_destroy
      description: Retrieve, update, or delete a survey. Staff only; used by the builder.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/reef/surveys/{id}/results/:
    get:
      operationId: surveys_results_retrieve
      description: Aggregated results feeding the analytics dashboard. Staff only.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/reef/surveys/{slug}/definition/:
    get:
      operationId: surveys_definition_retrieve
      description: |-
        Definition and theme for the runner. Published surveys only; an
        authenticated-visibility survey requires a signed-in caller.
      parameters:
        - in: path
          name: slug
          schema:
            type: string
          required: true
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDefinition'
          description: ''
  /api/reef/surveys/{slug}/responses/:
    post:
      operationId: surveys_responses_create
      description: Submit a response to a published survey.
      parameters:
        - in: path
          name: slug
          schema:
            type: string
          required: true
      tags:
        - surveys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResponseCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResponseCreate'
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCreate'
          description: ''
  /api/reef/surveys/open/:
    get:
      operationId: surveys_open_list
      description: |-
        Open surveys Red may offer. Bearer optional: an identified user also
        receives their targeted surveys, an anonymous caller sees open ones only.
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenSurvey'
          description: ''
components:
  schemas:
    DocumentSet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        visibility:
          allOf:
            - $ref: '#/components/schemas/DocumentSetVisibilityEnum'
          description: |-
            A set title and its membership say what someone is tracking, so publishing is the owner's choice.

            * `private` - Private
            * `public` - Public
        owner_name:
          type: string
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSetEntry'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - documents
        - id
        - owner_name
        - slug
        - title
        - updated_at
    DocumentSetEntry:
      type: object
      properties:
        doc:
          type: string
          readOnly: true
        rank:
          type: integer
          readOnly: true
          description: Lower sorts first
        added_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - added_at
        - doc
        - rank
    DocumentSetOrder:
      type: object
      description: The set's documents, in the order they should be shown.
      properties:
        documents:
          type: array
          items:
            type: string
      required:
        - documents
    DocumentSetVisibilityEnum:
      enum:
        - private
        - public
      type: string
      description: |-
        * `private` - Private
        * `public` - Public
    DocumentStats:
      type: object
      description: Public engagement numbers for one document.
      properties:
        doc:
          type: string
        rating_average:
          type: number
          format: double
          nullable: true
        rating_count:
          type: integer
        subscriber_count:
          type: integer
        set_count:
          type: integer
      required:
        - doc
        - rating_average
        - rating_count
        - set_count
        - subscriber_count
    KindEnum:
      enum:
        - new_rfc
        - by_status
        - obsoleted
        - subject_tag
        - rfc
        - set
      type: string
      description: |-
        * `new_rfc` - Any new RFC
        * `by_status` - New RFC by status
        * `obsoleted` - RFC obsoleted or made historic
        * `subject_tag` - RFC with a subject tag
        * `rfc` - Changes to one specific RFC
        * `set` - Changes to anything in a document set
    OpenSurvey:
      type: object
      description: Minimal representation for Red's open-survey list and popover.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        url:
          type: string
          readOnly: true
      required:
        - id
        - slug
        - title
        - url
    PatchedDocumentSet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        visibility:
          allOf:
            - $ref: '#/components/schemas/DocumentSetVisibilityEnum'
          description: |-
            A set title and its membership say what someone is tracking, so publishing is the owner's choice.

            * `private` - Private
            * `public` - Public
        owner_name:
          type: string
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSetEntry'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSurvey:
      type: object
      description: Full survey representation used by the management API and the builder.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 100
