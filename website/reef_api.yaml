openapi: 3.0.3
info:
  title: Reef
  version: 0.1.0
  description: Backend API for the Reef survey and engagement service
paths:
  /api/reef/me/documents/:
    get:
      operationId: me_documents_retrieve
      description: |-
        Return the authenticated caller's rating, subscription and set membership for each named document, along with the caller's own sets. One call for a whole page of documents.

        `doc` is repeatable and identifiers are canonicalized, so `rfc9110` and `RFC 9110` address the same document; the series has to be named, so `9110` on its own is rejected. A named document is always returned, with nulls if the caller has no state for it. At most 100 documents per request.

        Naming no document returns the caller's sets and an empty `documents` list, which is how a client loads the set list on its own. Unlike `/stats/`, an empty `doc` does not mean every document: that endpoint is swept once at build time, whereas this one is called on every page.

        Carries no public numbers. Ratings averages, subscriber counts and set counts are the same for every visitor and are served by `/stats/`.
      summary: Read your own state for a batch of documents
      parameters:
        - in: query
          name: doc
          schema:
            type: array
            items:
              type: string
          description: 'Document identifier, repeatable, at most 100 per request. The
            series must be named: rfc9110, bcp14, std66.'
      tags:
        - me
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDocuments'
          description: ''
  /api/reef/popularity/:
    get:
      operationId: popularity_list
      description: The curated most-popular list. Public; consumed by Red at build
        time.
      tags:
        - popularity
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularEntry'
          description: ''
  /api/reef/ratings/{rfc}/:
    get:
      operationId: ratings_retrieve
      description: |-
        Return the public average and count of ratings for one RFC. Open to anonymous callers. A credential adds nothing but `your_rating`, the caller's own 1-5 rating of this RFC, which is null if they have not rated it; for an anonymous caller it is always null.

        The identifier is canonicalized, so `9110`, `rfc9110` and `RFC 9110` all address the same document.
      summary: Read an RFC's rating
      parameters:
        - in: path
          name: rfc
          schema:
            type: string
          required: true
      tags:
        - ratings
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingAggregate'
          description: ''
    put:
      operationId: ratings_update
      description: Record the authenticated caller's 1-5 rating of one RFC, replacing
        their previous rating of it if there is one. Requires a credential. Returns
        the same body as GET, so the response carries the recomputed average and count
        along with `your_rating` echoing the value just set.
      summary: Set the caller's rating of an RFC
      parameters:
        - in: path
          name: rfc
          schema:
            type: string
          required: true
      tags:
        - ratings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RatingWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RatingWrite'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingAggregate'
          description: ''
    delete:
      operationId: ratings_destroy
      description: "Remove the authenticated caller's rating of one RFC, so it no
        longer counts towards the average. Requires a credential. Idempotent: a caller
        who has not rated this RFC gets the same response as one whose rating was
        just removed. Returns the same body as GET, so the response carries the recomputed
        average and count, with `your_rating` now null."
      summary: Withdraw the caller's rating of an RFC
      parameters:
        - in: path
          name: rfc
          schema:
            type: string
          required: true
      tags:
        - ratings
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingAggregate'
          description: ''
  /api/reef/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum:
              - json
              - yaml
        - in: query
          name: lang
          schema:
            type: string
            enum:
              - af
              - ar
              - ar-dz
              - ast
              - az
              - be
              - bg
              - bn
              - br
              - bs
              - ca
              - ckb
              - cs
              - cy
              - da
              - de
              - dsb
              - el
              - en
              - en-au
              - en-gb
              - eo
              - es
              - es-ar
              - es-co
              - es-mx
              - es-ni
              - es-ve
              - et
              - eu
              - fa
              - fi
              - fr
              - fy
              - ga
              - gd
              - gl
              - he
              - hi
              - hr
              - hsb
              - hu
              - hy
              - ia
              - id
              - ig
              - io
              - is
              - it
              - ja
              - ka
              - kab
              - kk
              - km
              - kn
              - ko
              - ky
              - lb
              - lt
              - lv
              - mk
              - ml
              - mn
              - mr
              - ms
              - my
              - nb
              - ne
              - nl
              - nn
              - os
              - pa
              - pl
              - pt
              - pt-br
              - ro
              - ru
              - sk
              - sl
              - sq
              - sr
              - sr-latn
              - sv
              - sw
              - ta
              - te
              - tg
              - th
              - tk
              - tr
              - tt
              - udm
              - ug
              - uk
              - ur
              - uz
              - vi
              - zh-hans
              - zh-hant
      tags:
        - schema
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/reef/sets/:
    get:
      operationId: sets_list
      description: List and create the caller's document sets.
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentSet'
          description: ''
    post:
      operationId: sets_create
      description: List and create the caller's document sets.
      tags:
        - sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentSet'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
  /api/reef/sets/{id}/:
    get:
      operationId: sets_retrieve
      description: |-
        Read a set; retitle, redescribe or delete your own.

        One URL for a set, whoever is asking: the id is the whole of a set's
        identity, so a shared link is this link and there is no second read
        endpoint to keep in step with it. Reading needs no token, which is what
        makes the link shareable, and holding the id is the whole of the
        permission: a set is a thing its owner made to be passed around, and the
        id is unguessable so that passing it around is the only way in. Writing is
        the owner's alone, and a write to somebody else's set 404s rather than 403s
        so that the refusal says nothing about whose it is.

        A set staff have taken down 404s here too, for everyone alike: it is left
        out of the queryset rather than refused, so nothing confirms it exists.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
    put:
      operationId: sets_update
      description: |-
        Read a set; retitle, redescribe or delete your own.

        One URL for a set, whoever is asking: the id is the whole of a set's
        identity, so a shared link is this link and there is no second read
        endpoint to keep in step with it. Reading needs no token, which is what
        makes the link shareable, and holding the id is the whole of the
        permission: a set is a thing its owner made to be passed around, and the
        id is unguessable so that passing it around is the only way in. Writing is
        the owner's alone, and a write to somebody else's set 404s rather than 403s
        so that the refusal says nothing about whose it is.

        A set staff have taken down 404s here too, for everyone alike: it is left
        out of the queryset rather than refused, so nothing confirms it exists.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentSet'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
    patch:
      operationId: sets_partial_update
      description: |-
        Read a set; retitle, redescribe or delete your own.

        One URL for a set, whoever is asking: the id is the whole of a set's
        identity, so a shared link is this link and there is no second read
        endpoint to keep in step with it. Reading needs no token, which is what
        makes the link shareable, and holding the id is the whole of the
        permission: a set is a thing its owner made to be passed around, and the
        id is unguessable so that passing it around is the only way in. Writing is
        the owner's alone, and a write to somebody else's set 404s rather than 403s
        so that the refusal says nothing about whose it is.

        A set staff have taken down 404s here too, for everyone alike: it is left
        out of the queryset rather than refused, so nothing confirms it exists.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDocumentSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDocumentSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDocumentSet'
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
    delete:
      operationId: sets_destroy
      description: |-
        Read a set; retitle, redescribe or delete your own.

        One URL for a set, whoever is asking: the id is the whole of a set's
        identity, so a shared link is this link and there is no second read
        endpoint to keep in step with it. Reading needs no token, which is what
        makes the link shareable, and holding the id is the whole of the
        permission: a set is a thing its owner made to be passed around, and the
        id is unguessable so that passing it around is the only way in. Writing is
        the owner's alone, and a write to somebody else's set 404s rather than 403s
        so that the refusal says nothing about whose it is.

        A set staff have taken down 404s here too, for everyone alike: it is left
        out of the queryset rather than refused, so nothing confirms it exists.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/reef/sets/{id}/documents/{doc}/:
    put:
      operationId: sets_documents_update
      description: |-
        Add or remove one document.

        PUT is idempotent, and the identifier is canonicalized first, so
        .../documents/RFC%209110/ and .../documents/rfc9110/ are the same entry.
      parameters:
        - in: path
          name: doc
          schema:
            type: string
          required: true
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
    delete:
      operationId: sets_documents_destroy
      description: |-
        Add or remove one document.

        PUT is idempotent, and the identifier is canonicalized first, so
        .../documents/RFC%209110/ and .../documents/rfc9110/ are the same entry.
      parameters:
        - in: path
          name: doc
          schema:
            type: string
          required: true
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - sets
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/reef/sets/{id}/order/:
    put:
      operationId: sets_order_update
      description: |-
        Rewrite the display order in one request.

        Ranks are replaced as a block rather than patched per entry, so a
        drag-and-drop is one call that cannot half-apply.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSetOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentSetOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentSetOrder'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSet'
          description: ''
  /api/reef/stats/:
    get:
      operationId: stats_list
      description: |-
        Rating, subscriber and set numbers per document.

        Public and unpaginated: Red precomputes the whole series in one call at
        build time, which is too many identifiers to name in a query string.
        Filtering with doc is for one-off lookups.
      parameters:
        - in: query
          name: doc
          schema:
            type: array
            items:
              type: string
          description: Document identifier, repeatable. Omit to get every document that
            has any engagement at all. A named document is always returned, with zeros
            if it has none.
        - in: query
          name: set
          schema:
            type: string
            format: uuid
          description: Document set id. Returns a row per document the set holds, including
            members with no engagement. Any set resolves for any caller holding its
            id; an id that names no set 404s. Combines with doc as an intersection.
      tags:
        - stats
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentStats'
          description: ''
  /api/reef/subjects/:
    get:
      operationId: subjects_list
      description: |-
        Every subject that exists, in name order. Public and unpaginated: the vocabulary is curated by staff rather than self-served, so it stays small enough to hand over whole.

        `doc` narrows the list to the subjects carried by one document, which is how a caller renders the subjects on an RFC page. The identifier is canonicalized, so `rfc9110` and `RFC 9110` address the same document, and the series has to be named.
      summary: List the subject vocabulary
      parameters:
        - in: query
          name: doc
          schema:
            type: string
          description: 'Return only the subjects carried by this document. The series
            must be named: rfc9110, bcp14, std66.'
      tags:
        - subjects
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
          description: ''
  /api/reef/subjects/{slug}/:
    get:
      operationId: subjects_retrieve
      description: 'Two shapes, told apart by `retired`. A live subject comes back
        in full. A retired one comes back as `slug`, `retired` and `merged_into` only:
        it is no longer offered and should not be rendered as current, and what is
        left is enough to redirect a link that names it.'
      summary: Read one subject and the documents carrying it
      parameters:
        - in: path
          name: slug
          schema:
            type: string
          required: true
      tags:
        - subjects
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetailOrRedirect'
          description: ''
  /api/reef/subscriptions/:
    get:
      operationId: subscriptions_list
      description: List and create the current user's subscriptions.
      tags:
        - subscriptions
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
          description: ''
    post:
      operationId: subscriptions_create
      description: List and create the current user's subscriptions.
      tags:
        - subscriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Subscription'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Subscription'
        required: true
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/reef/subscriptions/{id}/:
    delete:
      operationId: subscriptions_destroy
      description: Delete one of the current user's subscriptions.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - subscriptions
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: No response body
