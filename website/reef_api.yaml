      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
          description: ''
    delete:
      operationId: surveys_destroy
      description: Retrieve, update, or delete a survey. Staff only; used by the builder.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/reef/surveys/{id}/results/:
    get:
      operationId: surveys_results_retrieve
      description: Aggregated results feeding the analytics dashboard. Staff only.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/reef/surveys/{slug}/definition/:
    get:
      operationId: surveys_definition_retrieve
      description: |-
        Definition and theme for the runner. Published surveys only; an
        authenticated-visibility survey requires a signed-in caller.
      parameters:
        - in: path
          name: slug
          schema:
            type: string
          required: true
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDefinition'
          description: ''
  /api/reef/surveys/{slug}/responses/:
    post:
      operationId: surveys_responses_create
      description: Submit a response to a published survey.
      parameters:
        - in: path
          name: slug
          schema:
            type: string
          required: true
      tags:
        - surveys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResponseCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResponseCreate'
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCreate'
          description: ''
  /api/reef/surveys/open/:
    get:
      operationId: surveys_open_list
      description: |-
        Open surveys Red may offer. Bearer optional: an identified user also
        receives their targeted surveys, an anonymous caller sees open ones only.
      tags:
        - surveys
      security:
        - BearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenSurvey'
          description: ''
components:
  schemas:
    DocumentSet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSetEntry'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - documents
        - id
        - title
        - updated_at
    DocumentSetEntry:
      type: object
      properties:
        doc:
          type: string
          readOnly: true
        rank:
          type: integer
          readOnly: true
          description: Lower sorts first
        added_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - added_at
        - doc
        - rank
    DocumentSetOrder:
      type: object
      description: The set's documents, in the order they should be shown.
      properties:
        documents:
          type: array
          items:
            type: string
      required:
        - documents
    DocumentStats:
      type: object
      description: Public engagement numbers for one document.
      properties:
        doc:
          type: string
        rating_average:
          type: number
          format: double
          nullable: true
        rating_count:
          type: integer
        subscriber_count:
          type: integer
        set_count:
          type: integer
      required:
        - doc
        - rating_average
        - rating_count
        - set_count
        - subscriber_count
    KindEnum:
      enum:
        - new_rfc
        - by_status
        - obsoleted
        - rfc
        - set
        - subject
      type: string
      description: |-
        * `new_rfc` - Any new RFC
        * `by_status` - New RFC by status
        * `obsoleted` - RFC obsoleted or made historic
        * `rfc` - Changes to one specific RFC
        * `set` - Changes to anything in a document set
        * `subject` - Changes to anything carrying a subject
    MyDocument:
      type: object
      description: |-
        What one document is to the caller: their rating, their subscription,
        their sets.

        Nothing public: no average, no count, no subscriber total. Those are the
        same for everybody, so Red takes them from the data it already has for the
        route rather than from a per-caller request.
      properties:
        doc:
          type: string
        your_rating:
          type: integer
          nullable: true
        your_subscription_id:
          type: integer
          nullable: true
        your_set_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
        - doc
        - your_rating
        - your_set_ids
        - your_subscription_id
    MyDocumentSet:
      type: object
      description: |-
        One of the caller's sets, without its membership.

        Deliberately not docsets.DocumentSetSerializer: that one carries the set's
        whole `documents` array, which is the thing this endpoint exists to avoid
        sending. A client drawing "which of my sets hold this document" needs every
        set the caller owns to label the rows, but it only needs membership for the
        documents it is asking about — and that arrives per document as
        `your_set_ids`. Sending both would make the payload grow with the caller's
        library rather than with the page.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - description
        - id
        - title
        - updated_at
    MyDocuments:
      type: object
      description: "The whole response: the caller's sets, and a row per requested
        document."
      properties:
        sets:
          type: array
          items:
            $ref: '#/components/schemas/MyDocumentSet'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/MyDocument'
      required:
        - documents
        - sets
    OpenSurvey:
      type: object
      description: |-
        One survey as Red offers it, which is as a toast.

        The fields line up with Red's Notification: title, description and url are shown,
        and slug is the string Red keys a dismissal on. documents is the addition that
        tells it where to offer this at all.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        url:
          type: string
          readOnly: true
        documents:
          type: array
          items:
            type: string
          nullable: true
          readOnly: true
      required:
        - documents
        - id
        - slug
        - title
        - url
    PatchedDocumentSet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSetEntry'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSurvey:
      type: object
      description: Full survey representation used by the management API and the builder.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        definition: {}
        theme:
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        audience:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PopularEntry:
      type: object
      properties:
        rfc:
          type: string
          maxLength: 32
        rank:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Lower sorts first
      required:
        - rfc
    RatingAggregate:
      type: object
      properties:
        rfc:
          type: string
        average:
          type: number
          format: double
          nullable: true
        count:
          type: integer
        your_rating:
          type: integer
          nullable: true
      required:
        - average
        - count
        - rfc
        - your_rating
    RatingWrite:
      type: object
      properties:
        value:
          type: integer
          maximum: 5
          minimum: 1
      required:
        - value
    ResponseCreate:
      type: object
      properties:
        data: {}
        meta: {}
    RetiredSubject:
      type: object
      description: |-
        A retired subject, as the only thing a retired subject is still for.

        Deliberately not the detail shape. A retired subject is not offered, does not
        appear in the vocabulary, and should not be rendered as though it were current;
        what is left is enough to redirect a link that names it. Callers tell the two
        apart by `retired`, which the live shape also carries.
      properties:
        slug:
          type: string
          readOnly: true
          description: Stable identifier used in URLs and by Red. Changing it breaks
            links that name the old one; the name is the field to edit when the wording
            is what changed.
          pattern: ^[-a-zA-Z0-9_]+$
        retired:
          type: boolean
          readOnly: true
        merged_into:
          type: string
          description: Stable identifier used in URLs and by Red. Changing it breaks
            links that name the old one; the name is the field to edit when the wording
            is what changed.
          readOnly: true
      required:
        - merged_into
        - retired
        - slug
    StatusEnum:
      enum:
        - draft
        - published
        - closed
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `closed` - Closed
    Subject:
      type: object
      description: |-
        A subject as a caller sees it, without its membership.

        The id is carried as well as the slug because subscribing names the id:
        the subscription holds a foreign key so that renaming a subject cannot
        detach its subscribers, and the id is the half of a subject's identity
        that a rename does not touch.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Stable identifier used in URLs and by Red. Changing it breaks
            links that name the old one; the name is the field to edit when the wording
            is what changed.
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
          description: How the subject is shown to readers.
        description:
          type: string
          readOnly: true
          description: What belongs under this subject, for whoever curates it next
            and for a caller drawing a picker.
      required:
        - description
        - id
        - name
        - slug
    SubjectDetail:
      type: object
      description: |-
        A subject and the documents carrying it.

        Separate from the list serializer for the reason me.MyDocumentSetSerializer
        is separate from docsets.DocumentSetSerializer: a picker needs every
        subject and no membership, so sending membership in the list would make
        the payload grow with the whole catalogue rather than with the vocabulary.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Stable identifier used in URLs and by Red. Changing it breaks
            links that name the old one; the name is the field to edit when the wording
            is what changed.
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
          description: How the subject is shown to readers.
        description:
          type: string
          readOnly: true
          description: What belongs under this subject, for whoever curates it next
            and for a caller drawing a picker.
        retired:
          type: boolean
          readOnly: true
        documents:
          type: array
          items:
            type: string
          readOnly: true
      required:
        - description
        - documents
        - id
        - name
        - retired
        - slug
    SubjectDetailOrRedirect:
      oneOf:
        - $ref: '#/components/schemas/SubjectDetail'
        - $ref: '#/components/schemas/RetiredSubject'
    Subscription:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        params: {}
        set:
          type: string
          format: uuid
          nullable: true
        subject:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - id
        - kind
    Survey:
      type: object
      description: Full survey representation used by the management API and the builder.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        definition: {}
        theme:
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        audience:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - id
        - slug
        - title
        - updated_at
    SurveyDefinition:
      type: object
      description: Definition and theme served to the Nuxt runner.
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        definition: {}
        theme:
          nullable: true
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
      required:
        - slug
        - title
    VisibilityEnum:
      enum:
        - open
        - authenticated
      type: string
      description: |-
        * `open` - Open (anonymous)
        * `authenticated` - Authenticated only
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
