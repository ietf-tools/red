components:
  schemas:
    DocumentAreaOrGroup:
      type: object
      description: The area or group a document belongs to, narrowed to what a page
        names.
      properties:
        acronym:
          type: string
        name:
          type: string
      required:
        - acronym
        - name
    DocumentIdentifier:
      type: object
      description: One persistent identifier -- a DOI or an ISSN -- Red records for
        a document.
      properties:
        type:
          type: string
        value:
          type: string
      required:
        - type
        - value
    DocumentMetadata:
      type: object
      description: 'A document as the index file names it: just enough to render a
        row.'
      properties:
        title:
          type: string
          nullable: true
        subseries:
          type: array
          items:
            type: string
      required:
        - subseries
        - title
    DocumentSet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSetEntry'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - documents
        - id
        - title
        - updated_at
    DocumentSetEntry:
      type: object
      properties:
        doc:
          type: string
          readOnly: true
        rank:
          type: integer
          readOnly: true
          description: Lower sorts first
        added_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - added_at
        - doc
        - rank
    DocumentSetOrder:
      type: object
      description: The set's documents, in the order they should be shown.
      properties:
        documents:
          type: array
          items:
            type: string
      required:
        - documents
    DocumentStats:
      type: object
      description: Public engagement numbers for one document.
      properties:
        doc:
          type: string
        rating_average:
          type: number
          format: double
          nullable: true
        rating_count:
          type: integer
        subscriber_count:
          type: integer
        set_count:
          type: integer
      required:
        - doc
        - rating_average
        - rating_count
        - set_count
        - subscriber_count
    FullDocumentMetadata:
      type: object
      description: "A document as its own subject's file names it: everything Red's
        index says."
      properties:
        title:
          type: string
          nullable: true
        subseries:
          type: array
          items:
            type: string
        status:
          type: string
          nullable: true
        status_name:
          type: string
          nullable: true
        stream:
          type: string
          nullable: true
        stream_name:
          type: string
          nullable: true
        obsoletes:
          type: array
          items:
            type: integer
        obsoleted_by:
          type: array
          items:
            type: integer
        updates:
          type: array
          items:
            type: integer
        updated_by:
          type: array
          items:
            type: integer
        authors:
          type: array
          items:
            type: string
        published:
          type: string
          nullable: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/DocumentIdentifier'
        area:
          allOf:
            - $ref: '#/components/schemas/DocumentAreaOrGroup'
          nullable: true
        group:
          allOf:
            - $ref: '#/components/schemas/DocumentAreaOrGroup'
          nullable: true
        keywords:
          type: array
          items:
            type: string
        pages:
          type: integer
          nullable: true
        abstract:
          type: string
          nullable: true
      required:
        - abstract
        - area
        - authors
        - group
        - identifiers
        - keywords
        - obsoleted_by
        - obsoletes
        - pages
        - published
        - status
        - status_name
        - stream
        - stream_name
        - subseries
        - title
        - updated_by
        - updates
    KindEnum:
      enum:
        - new_rfc
        - by_status
        - obsoleted
        - rfc
        - set
        - subject
      type: string
      description: |-
        * `new_rfc` - Any new RFC
        * `by_status` - New RFC by status
        * `obsoleted` - RFC obsoleted or made historic
        * `rfc` - Changes to one specific RFC
        * `set` - Changes to anything in a document set
        * `subject` - Changes to anything carrying a subject
    MyDocument:
      type: object
      description: |-
        What one document is to the caller: their rating, their subscription,
        their sets.

        Nothing public: no average, no count, no subscriber total. Those are the
        same for everybody, so Red takes them from the data it already has for the
        route rather than from a per-caller request.
      properties:
        doc:
          type: string
        your_rating:
          type: integer
          nullable: true
        your_subscription_id:
          type: integer
          nullable: true
        your_set_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
        - doc
        - your_rating
        - your_set_ids
        - your_subscription_id
    MyDocumentSet:
      type: object
      description: |-
        One of the caller's sets, without its membership.

        Deliberately not docsets.DocumentSetSerializer: that one carries the set's
        whole `documents` array, which is the thing this endpoint exists to avoid
        sending. A client drawing "which of my sets hold this document" needs every
        set the caller owns to label the rows, but it only needs membership for the
        documents it is asking about — and that arrives per document as
        `your_set_ids`. Sending both would make the payload grow with the caller's
        library rather than with the page.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - description
        - id
        - title
        - updated_at
    MyDocuments:
      type: object
      description: "The whole response: the caller's sets, and a row per requested
        document."
      properties:
        sets:
          type: array
          items:
            $ref: '#/components/schemas/MyDocumentSet'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/MyDocument'
      required:
        - documents
        - sets
    OpenSurvey:
      type: object
      description: |-
        One survey as Red offers it, which is as a toast.

        The fields line up with Red's Notification: title, description and url are shown,
        and slug is the string Red keys a dismissal on. documents is the addition that
        tells it where to offer this at all.

        visibility says whether the runner will admit an anonymous visitor, so Red can
        offer an authenticated-only survey to a signed-in reader alone rather than
        sending an anonymous one to a runner that refuses them. It is the field that
        tells the two apart in the one payload that mixes them, which is the
        precomputed surveys/published.json; the rows an anonymous caller is served,
        here or from that store's surveys/open.json, are all "open" by construction.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        url:
          type: string
          readOnly: true
        documents:
          type: array
          items:
            type: string
          nullable: true
          readOnly: true
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
      required:
        - documents
        - id
        - slug
        - title
        - url
    PatchedDocumentSet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSetEntry'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSurvey:
      type: object
      description: Full survey representation used by the management API and the builder.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        definition: {}
        theme:
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        audience:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PopularEntry:
      type: object
      properties:
        rfc:
          type: string
          maxLength: 32
        rank:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Lower sorts first
      required:
        - rfc
    PrecomputedSubjectDetail:
      type: object
      description: |-
        A subject's own file: the served shape plus what a page cannot look up.

        Both additions are sibling maps rather than changes to the arrays they
        describe. Retyping `documents` into a list of objects, or `children` into
        one, is the change that breaks a caller, and it is what Reef asks Red not to
        do to it. A map also grows a field later without retyping anything.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Stable identifier used in URLs and by Red. Changing it leaves
            the old one behind as an alias, so links naming it still resolve; the
            name is still the field to edit when only the wording changed.
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
          description: How the subject is shown to readers.
        description:
          type: string
          readOnly: true
          description: What belongs under this subject, for whoever curates it next
            and for a caller drawing a picker.
        parent:
          type: string
          nullable: true
          readOnly: true
        path:
          type: string
          readOnly: true
          description: Slugs from the top down, separated by a slash. Derived; edit
            the slug or the parent instead.
        document_count:
          type: integer
          readOnly: true
        document_count_deep:
          type: integer
          readOnly: true
        retired:
          type: boolean
          readOnly: true
        children:
          type: array
          items:
            type: string
          readOnly: true
        aliases:
          type: array
          items:
            type: string
            description: A name that resolves to this subject. Readers following a
              link that uses it are redirected to the subject's own slug.
          readOnly: true
        documents:
          type: array
          items:
            type: string
          description: |-
            The documents assigned to this subject, and not to those beneath it.

            Direct assignments only. Red consumes this array and the precomputer keys
            document_meta off it, so widening it to the subtree would be a contract
            change. The subtree is the index file's business.
          readOnly: true
        document_meta:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FullDocumentMetadata'
          readOnly: true
        subject_meta:
          allOf:
            - $ref: '#/components/schemas/SubjectMeta'
          readOnly: true
      required:
        - aliases
        - children
        - description
        - document_count
        - document_count_deep
        - document_meta
        - documents
        - id
        - name
        - parent
        - path
        - retired
        - slug
        - subject_meta
    PrecomputedSubjectDetailOrRedirect:
      oneOf:
        - $ref: '#/components/schemas/PrecomputedSubjectDetail'
        - $ref: '#/components/schemas/RetiredSubject'
        - $ref: '#/components/schemas/SubjectAlias'
    RatingAggregate:
      type: object
      properties:
        rfc:
          type: string
        average:
          type: number
          format: double
          nullable: true
        count:
          type: integer
        your_rating:
          type: integer
          nullable: true
      required:
        - average
        - count
        - rfc
        - your_rating
    RatingWrite:
      type: object
      properties:
        value:
          type: integer
          maximum: 5
          minimum: 1
      required:
        - value
    ResponseCreate:
      type: object
      properties:
        data: {}
        meta: {}
    RetiredSubject:
      type: object
      description: |-
        A retired subject, as the only thing a retired subject is still for.

        Deliberately not the detail shape. A retired subject is not offered, does not
        appear in the vocabulary, and should not be rendered as though it were current;
        what is left is enough to redirect a link that names it. Callers tell the two
        apart by `retired`, which the live shape also carries.
      properties:
        slug:
          type: string
          readOnly: true
          description: Stable identifier used in URLs and by Red. Changing it leaves
            the old one behind as an alias, so links naming it still resolve; the
            name is still the field to edit when only the wording changed.
          pattern: ^[-a-zA-Z0-9_]+$
        retired:
          type: boolean
          readOnly: true
        merged_into:
          type: string
          description: Stable identifier used in URLs and by Red. Changing it leaves
            the old one behind as an alias, so links naming it still resolve; the
            name is still the field to edit when only the wording changed.
          readOnly: true
      required:
        - merged_into
        - retired
        - slug
    StatusEnum:
      enum:
        - draft
        - published
        - closed
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `closed` - Closed
    Subject:
      type: object
      description: |-
        A subject as a caller sees it, without its membership.

        The id is carried as well as the slug because subscribing names the id:
        the subscription holds a foreign key so that renaming a subject cannot
        detach its subscribers, and the id is the half of a subject's identity
        that a rename does not touch.

        parent and path are what let a caller build the tree from the flat list in one
        pass, with no second read and nothing nested. Both counts are carried because
        a picker wants a figure against every node without walking the subtree to get
        one, and because they are two integers.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Stable identifier used in URLs and by Red. Changing it leaves
            the old one behind as an alias, so links naming it still resolve; the
            name is still the field to edit when only the wording changed.
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
          description: How the subject is shown to readers.
        description:
          type: string
          readOnly: true
          description: What belongs under this subject, for whoever curates it next
            and for a caller drawing a picker.
        parent:
          type: string
          nullable: true
          readOnly: true
        path:
          type: string
          readOnly: true
          description: Slugs from the top down, separated by a slash. Derived; edit
            the slug or the parent instead.
        document_count:
          type: integer
          readOnly: true
        document_count_deep:
          type: integer
          readOnly: true
      required:
        - description
        - document_count
        - document_count_deep
        - id
        - name
        - parent
        - path
        - slug
    SubjectAlias:
      type: object
      description: |-
        An alias, as the only thing an alias is for: the name it resolves to.

        Not the subject's own payload served under the alias's URL. That would answer
        the read in one fetch, at the cost of publishing the same subject under two
        addresses with nothing saying which one is canonical, and canonicalising a link
        is the whole reason a caller asked. So the same stub shape a retired subject
        gets, and callers tell the shapes apart by which key is present.
      properties:
        slug:
          type: string
          readOnly: true
          description: A name that resolves to this subject. Readers following a link
            that uses it are redirected to the subject's own slug.
          pattern: ^[-a-zA-Z0-9_]+$
        alias_of:
          type: string
          description: Stable identifier used in URLs and by Red. Changing it leaves
            the old one behind as an alias, so links naming it still resolve; the
            name is still the field to edit when only the wording changed.
          readOnly: true
      required:
        - alias_of
        - slug
    SubjectAncestor:
      type: object
      description: |-
        One ancestor on the way up to the root, root first.

        The same fields ``Subject``/``SubjectIndexEntrySerializer`` already carry,
        minus what only makes sense on a subject's own file (``children``,
        ``path``). No nested children of its own: the ancestor chain is a single
        line up to the root, so there is nothing to nest.
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        document_count:
          type: integer
        document_count_deep:
          type: integer
      required:
        - description
        - document_count
        - document_count_deep
        - name
        - slug
    SubjectBranchNode:
      type: object
      description: |-
        One subject in a descendant branch, with its own children nested beneath it.

        A tree, not a flat map keyed by slug: a page rendering a nested listing
        needs to know which subject is whose child, and a flat map throws that
        relationship away.
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        document_count:
          type: integer
        document_count_deep:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/SubjectBranchNode'
      required:
        - children
        - description
        - document_count
        - document_count_deep
        - name
        - slug
    SubjectDetail:
      type: object
      description: |-
        A subject and the documents carrying it.

        Separate from the list serializer for the reason me.MyDocumentSetSerializer
        is separate from docsets.DocumentSetSerializer: a picker needs every
        subject and no membership, so sending membership in the list would make
        the payload grow with the whole catalogue rather than with the vocabulary.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Stable identifier used in URLs and by Red. Changing it leaves
            the old one behind as an alias, so links naming it still resolve; the
            name is still the field to edit when only the wording changed.
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
          description: How the subject is shown to readers.
        description:
          type: string
          readOnly: true
          description: What belongs under this subject, for whoever curates it next
            and for a caller drawing a picker.
        parent:
          type: string
          nullable: true
          readOnly: true
        path:
          type: string
          readOnly: true
          description: Slugs from the top down, separated by a slash. Derived; edit
            the slug or the parent instead.
        document_count:
          type: integer
          readOnly: true
        document_count_deep:
          type: integer
          readOnly: true
        retired:
          type: boolean
          readOnly: true
        children:
          type: array
          items:
            type: string
          readOnly: true
        aliases:
          type: array
          items:
            type: string
            description: A name that resolves to this subject. Readers following a
              link that uses it are redirected to the subject's own slug.
          readOnly: true
        documents:
          type: array
          items:
            type: string
          description: |-
            The documents assigned to this subject, and not to those beneath it.

            Direct assignments only. Red consumes this array and the precomputer keys
            document_meta off it, so widening it to the subtree would be a contract
            change. The subtree is the index file's business.
          readOnly: true
      required:
        - aliases
        - children
        - description
        - document_count
        - document_count_deep
        - documents
        - id
        - name
        - parent
        - path
        - retired
        - slug
    SubjectDetailOrRedirect:
      oneOf:
        - $ref: '#/components/schemas/SubjectDetail'
        - $ref: '#/components/schemas/RetiredSubject'
        - $ref: '#/components/schemas/SubjectAlias'
    SubjectIndex:
      type: object
      description: |-
        The whole vocabulary in one payload: the tree, the assignments, the titles.

        Two maps rather than two lists, both keyed, so that a caller looks a subject
        or a document up directly instead of building an index of its own. The
        metadata sits in one map referenced by identifier rather than beside each
        subject that carries the document, which would repeat every title once per
        covering subject.

        What is deliberately absent is each subject's subtree. It is derivable from
        ``path`` and ``children`` in the pass a caller is already making, and writing
        it out would store every identifier once per ancestor.
      properties:
        documents:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DocumentMetadata'
        subjects:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SubjectIndexEntry'
      required:
        - documents
        - subjects
    SubjectIndexEntry:
      type: object
      description: |-
        One subject in the index file.

        Field order is the file's key order: a run that finds the same data must
        write the same bytes. It is the list serializer's fields plus the two the
        index adds.
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        parent:
          type: string
          nullable: true
        path:
          type: string
        children:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            type: string
        document_count:
          type: integer
        document_count_deep:
          type: integer
      required:
        - children
        - description
        - document_count
        - document_count_deep
        - documents
        - id
        - name
        - parent
        - path
    SubjectMeta:
      type: object
      description: |-
        A subject's branch of the vocabulary: its ancestors and its whole
        descendant subtree, so that a page renders both without a second fetch.

        Not siblings, and not the subject itself, which carries its own name and
        description at the top level of this same file already.
      properties:
        ancestors:
          type: array
          items:
            $ref: '#/components/schemas/SubjectAncestor'
        descendants:
          type: array
          items:
            $ref: '#/components/schemas/SubjectBranchNode'
      required:
        - ancestors
        - descendants
    Subscription:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        params: {}
        set:
          type: string
          format: uuid
          nullable: true
        subject:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - id
        - kind
    Survey:
      type: object
      description: Full survey representation used by the management API and the builder.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        definition: {}
        theme:
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        audience:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - id
        - slug
        - title
        - updated_at
    SurveyDefinition:
      type: object
      description: Definition and theme served to the Nuxt runner.
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        definition: {}
        theme:
          nullable: true
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
      required:
        - slug
        - title
    VisibilityEnum:
      enum:
        - open
        - authenticated
      type: string
      description: |-
        * `open` - Open (anonymous)
        * `authenticated` - Authenticated only
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
